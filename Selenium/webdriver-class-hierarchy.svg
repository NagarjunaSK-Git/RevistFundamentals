<svg width="680" height="530" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Selenium WebDriver class hierarchy</title>
<desc>SearchContext is the root interface, extended by WebDriver and WebElement. WebDriver is implemented by RemoteWebDriver alongside JavascriptExecutor, TakesScreenshot and HasCapabilities. RemoteWebDriver is extended by ChromiumDriver and FirefoxDriver, and ChromiumDriver is further extended by ChromeDriver and EdgeDriver.</desc>

<rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
  <path d="M340,96 L340,116 L220,116 L220,136" marker-end="url(#arrow)"/>
  <path d="M340,96 L340,116 L460,116 L460,136" marker-end="url(#arrow)"/>
  <path d="M220,192 L220,210 L340,210 L340,228" marker-end="url(#arrow)"/>
  <path d="M340,284 L340,304 L220,304 L220,324" marker-end="url(#arrow)"/>
  <path d="M340,284 L340,304 L480,304 L480,324" marker-end="url(#arrow)"/>
  <path d="M220,380 L220,400 L130,400 L130,420" marker-end="url(#arrow)"/>
  <path d="M220,380 L220,400 L310,400 L310,420" marker-end="url(#arrow)"/>
</g>

<!-- SearchContext -->
<rect x="250" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">SearchContext</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Interface</text>

<!-- WebDriver -->
<rect x="120" y="136" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="220" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">WebDriver</text>
<text x="220" y="172" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Interface</text>

<!-- WebElement -->
<rect x="360" y="136" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="460" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">WebElement</text>
<text x="460" y="172" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Interface</text>

<!-- RemoteWebDriver -->
<rect x="160" y="228" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">RemoteWebDriver</text>
<text x="340" y="264" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">+ JS executor, screenshots, capabilities</text>

<!-- ChromiumDriver -->
<rect x="110" y="324" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="220" y="342" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">ChromiumDriver</text>
<text x="220" y="360" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Abstract class</text>

<!-- FirefoxDriver -->
<rect x="370" y="324" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480" y="342" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">FirefoxDriver</text>
<text x="480" y="360" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Concrete class</text>

<!-- ChromeDriver -->
<rect x="55" y="420" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="130" y="438" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">ChromeDriver</text>
<text x="130" y="456" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Concrete class</text>

<!-- EdgeDriver -->
<rect x="235" y="420" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="310" y="438" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">EdgeDriver</text>
<text x="310" y="456" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Concrete class</text>

<!-- Legend -->
<rect x="220" y="495" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="240" y="505" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">Interface</text>
<rect x="340" y="495" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="505" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">Class</text>
</svg>
